# Local nopCommerce 4.90.8 + PostgreSQL with the built plugin folder bind-mounted in.
#
#   .\build\build.ps1 -Version 4.90
#   docker compose -f docker/docker-compose.4.90.yml up -d
#   open http://localhost:8090  -> install wizard (PostgreSQL, server "db", database/user/password "nop")
#   node tests/e2e/verify.mjs   -> drives the wizard, installs + configures the plugin, asserts the tag
#   docker compose -f docker/docker-compose.4.90.yml down -v
#
# nopCommerce stops its own process after the install wizard; "restart: unless-stopped" brings it back.

name: deployseal-nop490

services:
  db:
    image: postgres:17-alpine
    # Deliberately NO "POSTGRES_DB: nop": nopCommerce must create the database itself
    # ("Create database if it doesn't exist" in the wizard) because that is the only path on
    # which it runs CREATE EXTENSION citext / pgcrypto; a pre-created database fails the
    # install with `type "citext" does not exist`.
    environment:
      POSTGRES_USER: nop
      POSTGRES_PASSWORD: nop
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nop -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nop490-db:/var/lib/postgresql/data

  nop:
    image: nopcommerceteam/nopcommerce:4.90.8
    ports:
      - "8090:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../.nop/4.90/src/Presentation/Nop.Web/Plugins/Widgets.DeploySeal:/app/Plugins/Widgets.DeploySeal

volumes:
  nop490-db:
