name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Release tag to build and attach the zips to. Required for a manual run (a push of a
          "v*" tag uses that tag automatically). Pick a tag that does not already have a release
          you care about — this workflow creates the release if it is missing, and otherwise
          uploads to it with --clobber, overwriting any existing assets of the same name.
        required: false
        type: string

jobs:
  build:
    name: Build plugin zip (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The four versions build/versions.json knows about (4.60, 4.70, 4.80, 4.90). Hard-coded
        # here rather than computed, so a version added to versions.json without a working build
        # yet does not silently join this matrix; add it here once its project is ready.
        version: ["4.60", "4.70", "4.80", "4.90"]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve TFM for this version (for the NuGet cache key)
        id: tfm
        shell: pwsh
        run: |
          $versions = Get-Content build/versions.json -Raw | ConvertFrom-Json
          $tfm = $versions.PSObject.Properties['${{ matrix.version }}'].Value.tfm
          "tfm=$tfm" >> $env:GITHUB_OUTPUT

      - name: Cache NuGet packages (per TFM)
        uses: actions/cache@v4
        with:
          path: ~/nuget-cache-${{ matrix.version }}
          key: nuget-plugin-${{ steps.tfm.outputs.tfm }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: |
            nuget-plugin-${{ steps.tfm.outputs.tfm }}-

      - name: Build plugin zip (in the version's SDK container)
        shell: pwsh
        run: ./build/build.ps1 -Version ${{ matrix.version }} -UseDocker -NuGetVolume "$HOME/nuget-cache-${{ matrix.version }}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeploySeal.Nop.Widget-${{ matrix.version }}
          path: artifacts/DeploySeal.Nop.Widget-${{ matrix.version }}.zip
          if-no-files-found: error

  release:
    name: Attach zips to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::workflow_dispatch needs a 'tag' input naming the release to build for (a tag push supplies it automatically)." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build the Marketplace-style all-versions bundle
        shell: pwsh
        run: ./build/bundle.ps1

      - name: Compute checksums
        working-directory: artifacts
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create/update the release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
